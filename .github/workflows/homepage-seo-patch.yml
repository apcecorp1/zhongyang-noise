name: Homepage SEO Patch

on:
  push:
    paths:
      - '.github/workflows/homepage-seo-patch.yml'

permissions:
  contents: write

jobs:
  patch-homepage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html safely
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<!-- HOMEPAGE-SEO-2026-10-05 -->'
          if marker in s:
              print('Homepage SEO patch already present; nothing to do.')
              raise SystemExit(0)

          block = r'''<!-- HOMEPAGE-SEO-2026-10-05 -->
<meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1">
<link rel="canonical" href="https://www.how-big-123.com/">
<meta name="author" content="中央污染防治設備有限公司｜中央噪音工程">
<meta name="geo.region" content="TW">
<meta property="og:site_name" content="中央噪音工程">
<meta property="og:type" content="website">
<meta property="og:url" content="https://www.how-big-123.com/">
<script type="application/ld+json">
{
  "@context":"https://schema.org",
  "@graph":[
    {
      "@type":["Organization","ProfessionalService"],
      "@id":"https://www.how-big-123.com/#organization",
      "name":"中央污染防治設備有限公司",
      "alternateName":"中央噪音工程",
      "url":"https://www.how-big-123.com/",
      "telephone":"+886983057746",
      "email":"apce.corp@gmail.com",
      "areaServed":[
        {"@type":"City","name":"桃園市"},
        {"@type":"City","name":"台北市"},
        {"@type":"City","name":"新北市"},
        {"@type":"Country","name":"台灣"}
      ],
      "knowsAbout":[
        "工業噪音改善","隔音工程","吸音工程","消音工程","減震工程","低頻噪音改善",
        "排風機噪音改善","冷卻水塔噪音改善","空壓機噪音改善","冰水主機噪音改善",
        "鼓風機噪音改善","機房噪音改善","結構傳振"
      ],
      "contactPoint":[
        {"@type":"ContactPoint","telephone":"+886983057746","contactType":"工業噪音振動部","areaServed":"TW","availableLanguage":"zh-TW"},
        {"@type":"ContactPoint","telephone":"+886915080979","contactType":"住宅裝潢隔音部","areaServed":"TW","availableLanguage":"zh-TW"}
      ]
    },
    {
      "@type":"WebSite",
      "@id":"https://www.how-big-123.com/#website",
      "url":"https://www.how-big-123.com/",
      "name":"中央噪音工程",
      "publisher":{"@id":"https://www.how-big-123.com/#organization"},
      "inLanguage":"zh-TW"
    },
    {
      "@type":"WebPage",
      "@id":"https://www.how-big-123.com/#webpage",
      "url":"https://www.how-big-123.com/",
      "name":"中央噪音工程｜工業噪音、隔音、消音、減震與低頻噪音改善",
      "about":{"@id":"https://www.how-big-123.com/#organization"},
      "isPartOf":{"@id":"https://www.how-big-123.com/#website"},
      "inLanguage":"zh-TW"
    },
    {
      "@type":"Service",
      "@id":"https://www.how-big-123.com/#industrial-noise-service",
      "name":"工業噪音改善與隔音消音減震工程",
      "provider":{"@id":"https://www.how-big-123.com/#organization"},
      "areaServed":["桃園市","台北市","新北市","台灣"],
      "serviceType":[
        "工業噪音改善","排風機噪音改善","冷卻水塔噪音改善","空壓機噪音改善",
        "冰水主機噪音改善","低頻噪音改善","隔音工程","吸音工程","消音工程","減震工程"
      ]
    }
  ]
}
</script>
'''

          m = re.search(r'</head\s*>', s, flags=re.I)
          if not m:
              raise SystemExit('No </head> found; aborting without modifying index.html')
          s = s[:m.start()] + block + '\n' + s[m.start():]
          p.write_text(s, encoding='utf-8')
          print('Inserted homepage SEO block before </head>.')
          PY
      - name: Commit homepage patch
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "SEO: strengthen homepage entity and service schema"
          git push
